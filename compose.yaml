
services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=webtoolkitusr
      - POSTGRES_PASSWORD=wtktikpwd
      - POSTGRES_DB=webtoolkitdb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    
volumes:
  pg-data: 
